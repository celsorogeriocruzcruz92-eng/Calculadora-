<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calculadora</title>
  <style>
    :root { color-scheme: dark; --bg:#111827; --panel:#1f2937; --key:#374151; --muted:#9ca3af; --accent:#7c3aed; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at top,#26334a,var(--bg) 55%); font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:#f9fafb; }
    .calculator { width:min(100%,360px); padding:20px; border:1px solid #ffffff14; border-radius:26px; background:#111827eF; box-shadow:0 24px 70px #0008; }
    h1 { margin:0 0 14px; font-size:1rem; font-weight:600; color:var(--muted); letter-spacing:.04em; }
    .screen { min-height:112px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; gap:8px; padding:14px 8px 20px; overflow:hidden; }
    #expression { min-height:1.4em; color:var(--muted); font-size:1rem; overflow-wrap:anywhere; text-align:right; }
    #display { width:100%; border:0; outline:0; background:transparent; color:#fff; font:300 clamp(2.2rem,12vw,3.3rem)/1.1 system-ui,sans-serif; text-align:right; }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    button { min-height:62px; border:0; border-radius:18px; background:var(--key); color:#f9fafb; font:600 1.2rem system-ui,sans-serif; cursor:pointer; transition:transform .08s,filter .15s; }
    button:hover { filter:brightness(1.18); }
    button:active { transform:scale(.96); }
    button.utility { background:#4b5563; }
    button.operator { background:#5b21b6; }
    button.equals { background:var(--accent); }
    button.zero { grid-column:span 2; }
    .hint { margin:14px 0 0; text-align:center; font-size:.75rem; color:#9ca3af; }
    @media (max-width:380px) { .calculator { padding:16px; } button { min-height:56px; } .keys { gap:8px; } }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculadora">
    <h1>CALCULADORA</h1>
    <section class="screen" aria-live="polite" aria-atomic="true">
      <div id="expression"></div>
      <output id="display">0</output>
    </section>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Limpar tudo">AC</button>
      <button class="utility" data-action="sign" aria-label="Trocar sinal">+/−</button>
      <button class="utility" data-action="percent" aria-label="Porcentagem">%</button>
      <button class="operator" data-op="÷" aria-label="Dividir">÷</button>
      <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="operator" data-op="×" aria-label="Multiplicar">×</button>
      <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="operator" data-op="−" aria-label="Subtrair">−</button>
      <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="operator" data-op="+" aria-label="Somar">+</button>
      <button class="zero" data-num="0">0</button><button data-action="decimal" aria-label="Vírgula decimal">,</button><button class="equals" data-action="equals" aria-label="Resultado">=</button>
    </div>
    <p class="hint">Também podes usar o teclado</p>
  </main>
  <script>
    (() => {
      const display = document.querySelector('#display');
      const expression = document.querySelector('#expression');
      let current = '0', previous = null, operator = null, fresh = false;
      const render = () => { display.textContent = current.replace('.', ','); };
      const format = n => {
        if (!Number.isFinite(n)) return 'Erro';
        const rounded = Number.parseFloat(n.toPrecision(12));
        return String(rounded);
      };
      function inputDigit(d) {
        if (current === 'Erro' || fresh) { current = d; fresh = false; }
        else if (current === '0') current = d;
        else if (current.replace('-', '').length < 14) current += d;
        render();
      }
      function chooseOperator(op) {
        if (current === 'Erro') return;
        if (operator && !fresh) calculate();
        previous = Number(current); operator = op; fresh = true;
        expression.textContent = `${current.replace('.', ',')} ${op}`;
      }
      function calculate() {
        if (!operator || previous === null || current === 'Erro') return;
        const a = previous, b = Number(current);
        let result;
        if (operator === '+') result = a + b;
        if (operator === '−') result = a - b;
        if (operator === '×') result = a * b;
        if (operator === '÷') result = b === 0 ? NaN : a / b;
        expression.textContent = `${format(a).replace('.', ',')} ${operator} ${current.replace('.', ',')} =`;
        current = format(result); previous = null; operator = null; fresh = true; render();
      }
      function clear() { current = '0'; previous = null; operator = null; fresh = false; expression.textContent = ''; render(); }
      function action(name) {
        if (name === 'clear') clear();
        if (name === 'equals') calculate();
        if (name === 'decimal' && current !== 'Erro') { if (fresh) { current = '0'; fresh = false; } if (!current.includes('.')) current += '.'; render(); }
        if (name === 'sign' && current !== 'Erro') { current = format(-Number(current)); render(); }
        if (name === 'percent' && current !== 'Erro') { current = format(Number(current) / 100); render(); }
        if (name === 'backspace' && current !== 'Erro') { current = current.length > 1 ? current.slice(0,-1) : '0'; render(); }
      }
      document.querySelector('.keys').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.num !== undefined) inputDigit(b.dataset.num);
        else if (b.dataset.op) chooseOperator(b.dataset.op);
        else if (b.dataset.action) action(b.dataset.action);
      });
      document.addEventListener('keydown', e => {
        if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
        else if (e.key === '.' || e.key === ',') action('decimal');
        else if (e.key === '+') chooseOperator('+');
        else if (e.key === '-') chooseOperator('−');
        else if (e.key === '*') chooseOperator('×');
        else if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
        else if (e.key === 'Enter' || e.key === '=') action('equals');
        else if (e.key === 'Escape') clear();
        else if (e.key === 'Backspace') action('backspace');
        else if (e.key === '%') action('percent');
      });
    })();
  </script>
</body>
</html>
